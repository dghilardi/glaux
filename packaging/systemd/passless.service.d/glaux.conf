# Drop-in for passless-bin's user unit. Do not enable passless.service itself:
# glaux-passkey-guard.service starts it only while the local session is unlocked.
[Unit]
PartOf=glaux-passkey-guard.service

[Service]
# Approves passkey requests without a prompt. Any local process can use the passkey
# while this unit runs; the guard stops it on screen lock and logout.
Environment=PASSLESS_INTERACTION_MODE=automatic
ExecStart=
ExecStart=/usr/bin/passless --backend-type tpm --tpm-path %h/.local/share/passless/tpm --constant-signature-counter --verbose=false
