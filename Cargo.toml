[package]
name = "glaux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Your Microsoft 365 mailbox, from the terminal. Native Rust, OWA and MCP."
license = "MIT"
publish = false

[[bin]]
name = "glaux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.7", features = ["server", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal", "io-util", "io-std", "sync"] }
tokio-tungstenite = "0.30"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
