# Omit archive_dir to use <Glaux data directory>/archive. Absolute paths only.
# archive_dir = "/absolute/private/mail-archive"
folder = "inbox"
page_size = 25
max_pages = 4

# First matching rule wins. Categories are local folders, never server moves.
# Classify automatic sources before project keywords. Unmatched mail stays in other
# for review; a category alone does not authorize indexing or embeddings.
# Header values and the optional exact sender are not proof of sender identity.
[[rules]]
category = "monitoring"
header = "subject"
contains = "prometheus"

[[rules]]
category = "monitoring"
header = "from"
contains = "grafana"

[[rules]]
category = "monitoring"
header = "subject"
contains = "grafana"

[[rules]]
category = "administrative"
header = "subject"
contains = "timbratur"

[[rules]]
category = "development-notifications"
header = "from"
contains = "bitbucket"

[[rules]]
category = "development-notifications"
header = "from"
contains = "jira"

# Invitations may carry agenda/context; keep them separate from RSVP noise.
# calendar-method reads the parsed text/calendar MIME parameter at any depth.
[[rules]]
category = "calendar-invitations"
header = "calendar-method"
contains = "REQUEST"

[[rules]]
category = "calendar-responses"
header = "calendar-method"
contains = "REPLY"

[[rules]]
category = "calendar-responses"
header = "calendar-method"
contains = "CANCEL"

# Other calendar methods still have a fallback category.
[[rules]]
category = "calendar"
header = "content-type"
contains = "text/calendar"

[[rules]]
category = "mailing-list"
header = "list-id"
contains = "<"

# An unsubscribe header indicates a subscription, not its usefulness or identity.
[[rules]]
category = "subscriptions"
header = "list-unsubscribe"
contains = "<"

# To narrow a rule, add an exact mailbox AND a header condition, for example:
# [[rules]]
# category = "monitoring"
# sender = "monitor@example.test"
# header = "subject"
# contains = "firing"

# Suggested consumers: monitoring/calendar-responses/development-notifications
# without embeddings; administrative ignored; calendar-invitations, subscriptions
# and other reviewed before project indexing. Keep payroll/billing and substantive
# HR communications separate from administrative reminders; no blanket sender ignore.
# Nothing is deleted by default. Retention only removes local copies, by server
# receive time, and remembers expired messages to avoid downloading them again.
# [retention]
# monitoring = "14d"
# development-notifications = "30d"
